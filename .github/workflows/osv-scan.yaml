name: OSV-Scanner (advisory)

# ERA-6694: advisory dependency SCA on PRs. Standalone workflow (not a job in
# ci.yml) because era-memory's ci.yml is the older single-job layout; embedding
# the reusable call as a sibling job triggered a startup failure. Path-filtered
# to dependency-changing PRs inside the reusable; advisory only (fail-on-vuln:
# false, never wired into a required check). advisory->required flip is ERA-6688.

on:
  pull_request:

jobs:
  osv-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: Era-Laboratories/meta-ci-actions/.github/workflows/osv-scanner.yaml@v0
    with:
      fail-on-vuln: false
